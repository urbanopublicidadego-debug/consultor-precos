<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Turbo V3 - Com Cadeado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        #camera { width: 100%; max-width: 500px; height: 280px; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 3px solid #2ecc71; margin-bottom: 10px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: rgba(255,0,0,0.5); box-shadow: 0 0 10px red; }
        .aviso { position: fixed; top: 10px; background: #3498db; color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 100; font-weight: bold; }
        .card-leitura { background: #1e1e1e; padding: 15px; width: 90%; border-radius: 15px; text-align: center; border-bottom: 4px solid #2ecc71; }
        .menu-ferramentas { width: 95%; background: #1a1a1a; border-radius: 10px; padding: 15px; display: none; margin-top: 10px; box-sizing: border-box; }
        .btn-acao { background: #2ecc71; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .item-row { background: #222; margin: 10px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #3498db; }
        input { background: #333; border: 1px solid #444; color: white; padding: 10px; margin: 5px 0; border-radius: 5px; width: calc(100% - 22px); font-size: 16px; }
    </style>
</head>
<body>

    <div id="msgAviso" class="aviso">PROCESSANDO... ⏳</div>

    <h2 style="color:#2ecc71; margin:10px 0;">⚡ SCANNER ESTÁVEL</h2>
    
    <div id="camera"></div>

    <div id="infoBox" class="card-leitura">
        <div id="txtNome" style="color:#3498db; font-weight:bold; text-transform: uppercase;">Aguardando Próximo...</div>
        <div id="txtPreco" style="font-size: 32px; margin: 5px 0;">R$ --</div>
        <small id="txtCod" style="color:#666;"></small>
    </div>

    <button class="btn-acao" onclick="toggleMenu()">📋 VER LISTA / CONFIGURAÇÕES</button>
    
    <div id="menuF" class="menu-ferramentas">
        <div style="display:flex; gap:10px;">
            <button style="flex:1; padding:10px;" onclick="exportar()">📥 EXP</button>
            <button style="flex:1; padding:10px;" onclick="document.getElementById('fileIn').click()">📤 IMP</button>
            <input type="file" id="fileIn" style="display:none" onchange="importar(event)">
        </div>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <div id="containerItens"></div>
        <button style="background:#c0392b; color:white; width:100%; padding:10px; margin-top:20px; border:none; border-radius:5px;" onclick="limparTudo()">APAGAR TUDO</button>
    </div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
    let estaProcessando = false; // O NOSSO CADEADO

    function iniciar() {
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
            locate: false, // Desativado para evitar falsos positivos constantes
            frequency: 5 // Lê apenas 5 vezes por segundo (reduz carga e erro)
        }, function(err) {
            if (err) return;
            Quagga.start();
        });
    }

    Quagga.onDetected(function(data) {
        if (estaProcessando) return; // SE ESTIVER TRANCADO, NÃO FAZ NADA

        const codigo = data.codeResult.code;
        if (!codigo || codigo.length < 8) return;

        // TRANCA O CADEADO IMEDIATAMENTE
        estaProcessando = true;
        
        // Feedback visual
        document.getElementById('msgAviso').style.display = "block";

        processar(codigo);

        // SÓ DESTRANCA DEPOIS DE 3 SEGUNDOS
        setTimeout(() => {
            estaProcessando = false;
            document.getElementById('msgAviso').style.display = "none";
            document.getElementById('txtNome').innerText = "PRONTO PARA O PRÓXIMO";
        }, 3000);
    });

    function processar(codigo) {
        const p = estoque.find(x => x.codigo === codigo);
        if (p) {
            atualizarTela(p);
        } else {
            const novo = { codigo: codigo, nome: "ITEM " + codigo.slice(-4), precoX: "0.00" };
            estoque.push(novo);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            atualizarTela(novo);
        }
    }

    function atualizarTela(p) {
        document.getElementById('txtNome').innerText = p.nome;
        document.getElementById('txtPreco').innerText = `R$ ${parseFloat(p.precoX).toFixed(2)}`;
        document.getElementById('txtCod').innerText = "CÓD: " + p.codigo;
    }

    // FUNÇÕES DE MENU (Igual anterior)
    function toggleMenu() {
        const m = document.getElementById('menuF');
        const cont = document.getElementById('containerItens');
        if (m.style.display === "block") { m.style.display = "none"; } 
        else {
            m.style.display = "block";
            cont.innerHTML = "";
            estoque.slice().reverse().forEach((p, idx) => {
                const rIdx = estoque.length - 1 - idx;
                cont.innerHTML += `
                    <div class="item-row">
                        <small>${p.codigo}</small><br>
                        <input type="text" value="${p.nome}" onchange="salvar(${rIdx}, 'nome', this.value)">
                        <input type="number" step="0.01" value="${p.precoX}" onchange="salvar(${rIdx}, 'precoX', this.value)">
                        <button onclick="excluir(${rIdx})" style="color:red; background:none; border:none;">[Excluir]</button>
                    </div>`;
            });
        }
    }

    function salvar(idx, campo, valor) {
        estoque[idx][campo] = valor;
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
    }

    function excluir(idx) {
        if(confirm("Remover?")) { estoque.splice(idx, 1); localStorage.setItem('meuEstoque', JSON.stringify(estoque)); toggleMenu(); toggleMenu(); }
    }

    function exportar() {
        const blob = new Blob([JSON.stringify(estoque)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "estoque.json"; a.click();
    }

    function importar(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            estoque = JSON.parse(e.target.result);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            location.reload();
        };
        reader.readAsText(event.target.files[0]);
    }

    function limparTudo() {
        if(confirm("Zerar tudo?")) { localStorage.removeItem('meuEstoque'); location.reload(); }
    }

    window.onload = iniciar;
</script>
</body>
</html>
