<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Diagnóstico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; text-align: center; }
        .btn { width: 100%; max-width: 350px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #camera { width: 100%; max-width: 400px; height: 250px; background: #000; border-radius: 15px; display: none; border: 2px solid #2ecc71; margin: 0 auto 15px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; border-bottom: 4px solid #2ecc71; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; background: #222; color: white; border: 1px solid #444; }
    </style>
</head>
<body>

    <h2>🔎 Teste de Memória</h2>
    
    <button class="btn" style="background:#2ecc71; color:white;" onclick="ligarCamera()">1. LER CÓDIGO</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Aguardando...</div>

    <div id="formCadastro" class="card" style="display:none;">
        <h3>Cadastrar Item</h3>
        <input type="text" id="cadCodigo" readonly>
        <input type="text" id="cadNome" placeholder="Nome">
        <input type="number" id="cadPreco" step="0.01" placeholder="Preço">
        <button class="btn" style="background:#3498db; color:white;" onclick="salvar()">2. SALVAR NO CELULAR</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <button class="btn" style="background:#f1c40f; color:black;" onclick="verBanco()">🔍 MOSTRAR O QUE TEM SALVO</button>
    <button class="btn" style="background:#c0392b; color:white;" onclick="localStorage.clear(); alert('Memória Limpa!'); location.reload();">🚨 ZERAR TUDO</button>

<script>
    function ligarCamera() {
        document.getElementById('camera').style.display = "block";
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.getElementById('camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] }
        }, function(err) {
            if (err) return alert("Erro câmera: " + err);
            Quagga.start();
        });
        Quagga.onDetected(function(data) {
            const cod = data.codeResult.code;
            Quagga.stop();
            document.getElementById('camera').style.display = "none";
            processar(cod);
        });
    }

    function processar(cod) {
        const estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        // Limpeza absoluta: remove tudo que não for número
        const codLimpo = cod.toString().replace(/\D/g, "");
        
        const p = estoque.find(x => x.codigo.toString().replace(/\D/g, "") === codLimpo);

        if (p) {
            document.getElementById('formCadastro').style.display = "none";
            document.getElementById('resultado').innerHTML = `
                <h2 style="color:#2ecc71;">${p.nome}</h2>
                <h1 style="margin:0;">R$ ${parseFloat(p.preco).toFixed(2)}</h1>
                <small>Código: ${codLimpo}</small>
            `;
        } else {
            document.getElementById('resultado').innerHTML = "CÓDIGO NOVO";
            document.getElementById('cadCodigo').value = codLimpo;
            document.getElementById('formCadastro').style.display = "block";
        }
    }

    function salvar() {
        const cod = document.getElementById('cadCodigo').value;
        const nome = document.getElementById('cadNome').value;
        const preco = document.getElementById('cadPreco').value;
        
        if(!nome || !preco) return alert("Preencha os campos!");

        let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        estoque.push({ codigo: cod, nome: nome, preco: preco });
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
        
        alert("ITEM SALVO! Agora tente ler ele novamente.");
        document.getElementById('formCadastro').style.display = "none";
        processar(cod);
    }

    function verBanco() {
        const estoque = localStorage.getItem('meuEstoque');
        if(!estoque || estoque === "[]") {
            alert("A memória está vazia!");
        } else {
            alert("ITENS NA MEMÓRIA:\n" + estoque);
        }
    }
</script>
</body>
</html>
