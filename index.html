<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultor de Preços Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 300px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-scan { background: #2ecc71; color: white; font-size: 18px; }
        #camera { width: 100%; max-width: 400px; height: 250px; background: #000; border-radius: 15px; overflow: hidden; display: none; position: relative; border: 2px solid #2ecc71; margin-bottom: 15px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: red; box-shadow: 0 0 10px red; }
        .card { background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; border-radius: 15px; border-bottom: 4px solid #2ecc71; box-sizing: border-box; text-align: center; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; font-size: 16px; }
        #listaProdutos { width: 100%; max-width: 350px; text-align: left; font-size: 14px; background: #252525; border-radius: 10px; padding: 15px; display:none; border: 1px solid #444; }
        .item-lista { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 12px; }
    </style>
</head>
<body>

    <h2>🔎 Scanner de Preços</h2>
    
    <button class="btn btn-scan" onclick="ligarCamera()">ABRIR CÂMERA</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Aguardando leitura...</div>

    <div id="formCadastro" class="card" style="display:none;">
        <h3 style="margin:0; color:#3498db;">Cadastrar</h3>
        <input type="text" id="cadCodigo" readonly style="background:#111; color:#888;">
        <input type="text" id="cadNome" placeholder="Nome">
        <input type="number" id="cadPrecoX" step="0.01" placeholder="Seu Preço R$">
        <input type="number" id="cadPrecoC" step="0.01" placeholder="Concorrente R$">
        <button class="btn" style="background:#3498db; color:white; width:100%" onclick="salvarNoBanco()">SALVAR</button>
    </div>

    <button class="btn" style="background:#222; width:100%; border:1px solid #444; color:white" onclick="toggleLista()">📋 VER ITENS SALVOS</button>
    <div id="listaProdutos"></div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];

    function ligarCamera() {
        const camDiv = document.getElementById('camera');
        camDiv.style.display = "block";
        document.getElementById('formCadastro').style.display = "none";
        document.getElementById('resultado').innerHTML = "Iniciando...";

        // RESET TOTAL DO LEITOR
        try { Quagga.stop(); } catch(e) {}

        Quagga.init({
            inputStream: { 
                name: "Live", 
                type: "LiveStream", 
                target: camDiv, 
                constraints: { facingMode: "environment" } 
            },
            decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, function(err) {
            if (err) { 
                alert("ERRO NA CÂMERA: " + err.name); 
                console.log(err);
                return; 
            }
            Quagga.start();
        });
    }

    Quagga.onDetected(function(data) {
        const codigo = data.codeResult.code;
        Quagga.stop();
        document.getElementById('camera').style.display = "none";
        processarLeitura(codigo);
    });

    function processarLeitura(codigo) {
        const resDiv = document.getElementById('resultado');
        const form = document.getElementById('formCadastro');
        estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        const p = estoque.find(x => x.codigo === codigo);

        if (p) {
            resDiv.innerHTML = `<h2 style="color:#2ecc71">${p.nome}</h2><div style="font-size:30px">R$ ${parseFloat(p.precoX).toFixed(2)}</div><p>Concorrente: R$ ${p.precoC}</p><button class="btn btn-scan" onclick="ligarCamera()">LER OUTRO</button>`;
        } else {
            resDiv.innerHTML = `<p style="color:#e74c3c">Não encontrado: ${codigo}</p>`;
            document.getElementById('cadCodigo').value = codigo;
            form.style.display = "block";
        }
    }

    function salvarNoBanco() {
        const cod = document.getElementById('cadCodigo').value;
        const nome = document.getElementById('cadNome').value;
        const pX = document.getElementById('cadPrecoX').value;
        const pC = document.getElementById('cadPrecoC').value;
        if(!nome || !pX) return alert("Preencha Nome e Preço!");
        estoque.push({ codigo: cod, nome: nome, precoX: pX, precoC: pC || 0 });
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
        alert("Salvo!");
        processarLeitura(cod);
    }

    function removerItem(codigo) {
        if(confirm("Apagar item?")) {
            estoque = estoque.filter(p => p.codigo !== codigo);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            atualizarLista();
        }
    }

    function atualizarLista() {
        const div = document.getElementById('listaProdutos');
        if (estoque.length === 0) { div.innerHTML = "<p>Vazio</p>"; return; }
        div.innerHTML = "<h4>Itens:</h4>";
        estoque.forEach(p => {
            div.innerHTML += `<div class="item-lista"><span>${p.nome}<br>R$ ${p.precoX}</span><button class="btn-del" onclick="removerItem('${p.codigo}')">X</button></div>`;
        });
    }

    function toggleLista() {
        const div = document.getElementById('listaProdutos');
        if(div.style.display === "none") { atualizarLista(); div.style.display = "block"; }
        else { div.style.display = "none"; }
    }
</script>
</body>
</html>
