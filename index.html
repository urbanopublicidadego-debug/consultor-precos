<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultor de Preços - Scanner</title>
    <!-- Importação da biblioteca de leitura de códigos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    
    <style>
        /* Estilo Dark Mode focado em Mobile */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { color: #2ecc71; margin-bottom: 10px; }

        /* Container da Câmera */
        #camera { 
            width: 100%; 
            max-width: 400px; 
            height: 300px; 
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #000;
            display: none; /* Inicia escondido */
            margin-bottom: 20px;
        }

        /* Ajuste do vídeo dentro da div */
        #camera video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Linha guia de leitura */
        #camera::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: rgba(255, 0, 0, 0.6);
            box-shadow: 0 0 8px red;
            z-index: 10;
        }

        .btn-scan { 
            background-color: #2ecc71; 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 30px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            margin-bottom: 20px;
        }

        .resultado-card { 
            background: #1e1e1e; 
            padding: 20px; 
            width: 100%;
            max-width: 360px; 
            border-radius: 15px; 
            text-align: left;
            border-bottom: 4px solid #2ecc71;
        }

        .mercado-info { display: flex; justify-content: space-between; margin-top: 10px; }
        .melhor-preco { color: #2ecc71; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

    <h2>🔎 Scanner de Preços</h2>
    
    <button class="btn-scan" onclick="iniciarScanner()">LER CÓDIGO DE BARRAS</button>

    <div id="camera"></div>

    <div id="infoProduto" class="resultado-card">
        <p style="text-align: center;">Clique no botão para escanear um produto.</p>
    </div>

<script>
    // Base de dados exemplo (Substitua pelos códigos dos seus produtos)
    const estoque = [
        { codigo: "7891234567890", nome: "Óleo de Soja 900ml", precoX: 7.50, concorrente: 6.85 },
        { codigo: "7890001112223", nome: "Arroz Agulhinha 5kg", precoX: 25.90, concorrente: 24.50 }
    ];

    function iniciarScanner() {
        const camDiv = document.getElementById('camera');
        camDiv.style.display = "block";
        
        document.getElementById('infoProduto').innerHTML = "<p style='text-align:center;'>Buscando foco...</p>";

        Quagga.init({
    inputStream: {
        name: "Live",
        type: "LiveStream",
        target: camDiv,
        constraints: {
            // Ajuste fino para celulares modernos
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "environment", // Garante a de TRÁS
            focusMode: "continuous"    // Tenta forçar o foco automático
        }
    },
    locator: {
        halfSample: true,
        patchSize: "medium"
    },
    decoder: {
        readers: ["ean_reader"]
    }
}, function(err) {
    if (err) {
        // Agora vamos mostrar o nome do erro técnico para eu te ajudar melhor
        alert("Erro Técnico: " + err.name); 
        console.error(err);
        return;
    }
    Quagga.start();
});

        Quagga.onDetected(function(result) {
            const codigoLido = result.codeResult.code;
            
            // Toca um bipe (opcional) e para o scanner
            Quagga.stop();
            camDiv.style.display = "none";
            
            buscarProduto(codigoLido);
        });
    }

    function buscarProduto(codigo) {
        const painel = document.getElementById('infoProduto');
        const produto = estoque.find(p => p.codigo === codigo);

        if (produto) {
            painel.innerHTML = `
                <h3 style="margin:0">${produto.nome}</h3>
                <small>EAN: ${codigo}</small>
                <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
                <div class="mercado-info">
                    <span>Supermercado X:</span>
                    <span>R$ ${produto.precoX.toFixed(2)}</span>
                </div>
                <div class="mercado-info">
                    <span>Concorrência:</span>
                    <span class="melhor-preco">R$ ${produto.concorrente.toFixed(2)}</span>
                </div>
            `;
        } else {
            painel.innerHTML = `
                <p style="color:#e74c3c">Produto não cadastrado!</p>
                <p>Código lido: <b>${codigo}</b></p>
                <button onclick="iniciarScanner()" style="width:100%; padding:10px;">Tentar Novamente</button>
            `;
        }
    }
</script>

</body>
</html>
