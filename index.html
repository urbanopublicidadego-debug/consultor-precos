<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Pro - Estável</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 300px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; text-align: center; }
        .btn-scan { background: #2ecc71; color: white; font-size: 18px; }
        .btn-save { background: #3498db; color: white; }
        .btn-util { background: #444; color: white; font-size: 13px; margin: 5px; border-radius: 5px; flex: 1; }
        
        #camera { width: 100%; max-width: 400px; height: 250px; background: #000; border-radius: 15px; overflow: hidden; display: none; position: relative; border: 2px solid #2ecc71; margin-bottom: 15px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: red; box-shadow: 0 0 10px red; }

        .card { background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; border-radius: 15px; border-bottom: 4px solid #2ecc71; box-sizing: border-box; text-align: center; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; font-size: 16px; }
        
        #listaProdutos { width: 100%; max-width: 350px; background: #252525; border-radius: 10px; padding: 15px; display:none; border: 1px solid #444; margin-top: 10px; box-sizing: border-box; }
        .item-lista { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🔎 Consultor de Preços</h2>
    
    <button class="btn btn-scan" id="btnIniciar" onclick="ligarCamera()">LER CÓDIGO DE BARRAS</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Aguardando leitura...</div>

    <div id="formCadastro" class="card" style="display:none;">
        <h3 style="margin:0; color:#3498db;">Cadastrar Produto</h3>
        <input type="text" id="cadCodigo" readonly style="background:#111; color:#888;">
        <input type="text" id="cadNome" placeholder="Nome do Produto">
        <input type="number" id="cadPreco" step="0.01" placeholder="Preço R$">
        <button class="btn btn-save" onclick="salvar()">SALVAR AGORA</button>
    </div>

    <div style="width: 100%; max-width: 350px; display: flex; justify-content: space-between;">
        <button class="btn btn-util" onclick="exportar()">📥 EXPORTAR</button>
        <button class="btn btn-util" onclick="toggleLista()">📋 VER LISTA / EXCLUIR</button>
    </div>

    <div id="listaProdutos"></div>

    <button class="btn btn-util" style="background:#c0392b; width: 100%; max-width: 350px; margin-top: 20px;" onclick="limparTudo()">🚨 LIMPAR TODA A MEMÓRIA</button>

<script>
    function ligarCamera() {
        document.getElementById('camera').style.display = "block";
        document.getElementById('btnIniciar').style.display = "none";
        document.getElementById('formCadastro').style.display = "none";
        document.getElementById('listaProdutos').style.display = "none";
        document.getElementById('resultado').innerHTML = "Buscando...";

        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.getElementById('camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] }
        }, function(err) {
            if (err) { alert("Câmera não encontrada!"); return; }
            Quagga.start();
        });

        Quagga.onDetected(ouvirCodigo);
    }

    function ouvirCodigo(data) {
        const codigo = data.codeResult.code;
        Quagga.stop();
        Quagga.offDetected(ouvirCodigo);
        
        document.getElementById('camera').style.display = "none";
        document.getElementById('btnIniciar').style.display = "block";
        
        processar(codigo);
    }

    function processar(codigo) {
        // ESSENCIAL: Puxa do banco de dados toda vez que ler
        const estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        const produto = estoque.find(x => x.codigo === codigo);

        if (produto) {
            document.getElementById('formCadastro').style.display = "none";
            document.getElementById('resultado').innerHTML = `
                <h2 style="color:#2ecc71; margin:0;">${produto.nome}</h2>
                <div style="font-size:35px; font-weight:bold;">R$ ${parseFloat(produto.preco).toFixed(2)}</div>
                <small>Cód: ${codigo}</small><br>
                <button class="btn btn-scan" style="margin-top:15px; padding:10px;" onclick="ligarCamera()">LER PRÓXIMO</button>
            `;
        } else {
            document.getElementById('resultado').innerHTML = "Produto não encontrado!";
            document.getElementById('cadCodigo').value = codigo;
            document.getElementById('cadNome').value = "";
            document.getElementById('cadPreco').value = "";
            document.getElementById('formCadastro').style.display = "block";
        }
    }

    function salvar() {
        const cod = document.getElementById('cadCodigo').value;
        const nome = document.getElementById('cadNome').value;
        const preco = document.getElementById('cadPreco').value;
        if(!nome || !preco) return alert("Preencha Nome e Preço!");

        let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        estoque.push({ codigo: cod, nome, preco });
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
        
        alert("Produto cadastrado!");
        document.getElementById('formCadastro').style.display = "none";
        processar(cod); // Re-processa para mostrar o preço na hora
    }

    function toggleLista() {
        const listaDiv = document.getElementById('listaProdutos');
        if (listaDiv.style.display === "none" || listaDiv.style.display === "") {
            const estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
            if(estoque.length === 0) { listaDiv.innerHTML = "<p>Nenhum item salvo.</p>"; }
            else {
                listaDiv.innerHTML = "<h4>Itens Salvos:</h4>";
                estoque.forEach((p, index) => {
                    listaDiv.innerHTML += `
                        <div class="item-lista">
                            <span>${p.nome}<br><b>R$ ${p.preco}</b></span>
                            <button class="btn-del" onclick="removerItem(${index})">X</button>
                        </div>`;
                });
            }
            listaDiv.style.display = "block";
        } else {
            listaDiv.style.display = "none";
        }
    }

    function removerItem(index) {
        if(confirm("Excluir este item?")) {
            let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
            estoque.splice(index, 1);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            toggleLista(); toggleLista(); // Recarrega a lista
        }
    }

    function exportar() {
        const estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        const blob = new Blob([JSON.stringify(estoque)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "precos.json"; a.click();
    }

    function limparTudo() {
        if(confirm("🚨 APAGAR TUDO? Isso não pode ser desfeito!")) {
            localStorage.removeItem('meuEstoque');
            location.reload();
        }
    }
</script>
</body>
</html>
