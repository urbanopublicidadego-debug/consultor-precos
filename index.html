<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Estável - Sem Loop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 300px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-scan { background: #2ecc71; color: white; font-size: 18px; }
        .btn-save { background: #3498db; color: white; }
        #camera { width: 100%; max-width: 400px; height: 250px; background: #000; border-radius: 15px; overflow: hidden; display: none; position: relative; border: 3px solid #2ecc71; margin-bottom: 15px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: red; box-shadow: 0 0 10px red; }
        .card { background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; border-radius: 15px; border-bottom: 4px solid #2ecc71; box-sizing: border-box; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; font-size: 16px; }
        .item-lista { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h2>🔎 Consultor de Preços</h2>
    
    <button class="btn btn-scan" id="btnIniciar" onclick="ligarCamera()">LER CÓDIGO DE BARRAS</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Aguardando...</div>

    <div id="formCadastro" class="card" style="display:none; margin-top:10px;">
        <h3>Novo Produto</h3>
        <input type="text" id="cadCodigo" readonly style="color:#888;">
        <input type="text" id="cadNome" placeholder="Nome do Produto">
        <input type="number" id="cadPreco" step="0.01" placeholder="Preço R$">
        <button class="btn btn-save" onclick="salvar()">SALVAR</button>
    </div>

    <div style="margin-top:20px; width:100%; max-width:350px; display:flex; gap:10px;">
        <button onclick="exportar()" style="flex:1; padding:10px; background:#444; color:white; border:none; border-radius:5px;">EXPORTAR</button>
        <button onclick="limpar()" style="flex:1; padding:10px; background:#c0392b; color:white; border:none; border-radius:5px;">LIMPAR TUDO</button>
    </div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];

    function ligarCamera() {
        // Limpa a tela
        document.getElementById('camera').style.display = "block";
        document.getElementById('btnIniciar').style.display = "none";
        document.getElementById('formCadastro').style.display = "none";
        document.getElementById('resultado').innerHTML = "Buscando...";

        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.getElementById('camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
            locate: true
        }, function(err) {
            if (err) return alert("Erro na câmera");
            Quagga.start();
        });

        // ESCUTA UMA VEZ E PARA (A trava anti-loop)
        Quagga.onDetected(ouvirCodigo);
    }

    function ouvirCodigo(data) {
        const codigo = data.codeResult.code;
        
        // PARA TUDO IMEDIATAMENTE
        Quagga.stop();
        Quagga.offDetected(ouvirCodigo); // Desliga o "ouvido" do scanner
        
        document.getElementById('camera').style.display = "none";
        document.getElementById('btnIniciar').style.display = "block";
        
        processar(codigo);
    }

    function processar(codigo) {
        estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        const p = estoque.find(x => x.codigo === codigo);

        if (p) {
            document.getElementById('resultado').innerHTML = `
                <h2 style="color:#2ecc71; margin:0;">${p.nome}</h2>
                <div style="font-size:35px; font-weight:bold;">R$ ${parseFloat(p.preco).toFixed(2)}</div>
                <small>Cód: ${codigo}</small>
            `;
        } else {
            document.getElementById('resultado').innerHTML = "Produto não encontrado!";
            document.getElementById('cadCodigo').value = codigo;
            document.getElementById('cadNome').value = "";
            document.getElementById('cadPreco').value = "";
            document.getElementById('formCadastro').style.display = "block";
        }
    }

    function salvar() {
        const cod = document.getElementById('cadCodigo').value;
        const nome = document.getElementById('cadNome').value;
        const preco = document.getElementById('cadPreco').value;
        if(!nome || !preco) return alert("Preencha tudo");

        estoque.push({ codigo: cod, nome, preco });
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
        alert("Salvo!");
        document.getElementById('formCadastro').style.display = "none";
        processar(cod);
    }

    function exportar() {
        const blob = new Blob([JSON.stringify(estoque)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "precos.json"; a.click();
    }

    function limpar() {
        if(confirm("Apagar tudo?")) { localStorage.removeItem('meuEstoque'); location.reload(); }
    }
</script>
</body>
</html>
