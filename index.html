<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultor Pro v10</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 350px; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 15px; transition: 0.2s; }
        .btn-scan { background: #2ecc71; color: white; font-size: 18px; margin-bottom: 15px; }
        .btn-util { background: #333; color: #eee; flex: 1; font-size: 12px; padding: 10px; }
        
        #camera { width: 100%; max-width: 400px; height: 200px; background: #000; border-radius: 20px; display: none; position: relative; border: 3px solid #2ecc71; margin-bottom: 15px; overflow: hidden; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        
        .card { background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; border-radius: 15px; border-bottom: 5px solid #2ecc71; box-sizing: border-box; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #444; font-size: 16px; box-sizing: border-box; }
        
        .painel-lista { width: 100%; max-width: 350px; background: #1a1a1a; margin-top: 15px; border-radius: 10px; padding: 15px; display: none; border: 1px solid #333; box-sizing: border-box; }
        .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 8px 0; font-size: 14px; }
        .btn-del { background: #e74c3c; color: white; border: none; padding: 5px 8px; border-radius: 4px; font-size: 10px; }
    </style>
</head>
<body>

    <h2 style="color:#2ecc71; margin-bottom:15px;">🔎 Consultor Pro</h2>
    
    <button class="btn btn-scan" id="btnScan" onclick="ligar()">ABRIR SCANNER</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Pronto para a leitura...</div>

    <div id="formCad" class="card" style="display:none; border-color:#3498db; margin-top:15px;">
        <h3 style="color:#3498db; margin:0;">Novo Cadastro</h3>
        <input type="text" id="codFinal" readonly style="color:#0f0; font-family:monospace; text-align:center;">
        <input type="text" id="nomeProd" placeholder="Nome do Produto">
        <input type="number" id="precoProd" step="0.01" placeholder="Preço R$">
        <button class="btn" style="background:#3498db; color:white;" onclick="salvar()">GRAVAR AGORA</button>
    </div>

    <div style="display:flex; gap:8px; width:100%; max-width:350px; margin-top:15px;">
        <button class="btn btn-util" onclick="toggleLista()">📋 LISTA</button>
        <button class="btn btn-util" onclick="exportar()">📥 EXPORTAR</button>
        <button class="btn btn-util" onclick="document.getElementById('inputImport').click()">📤 IMPORTAR</button>
    </div>
    <input type="file" id="inputImport" style="display:none" accept=".json" onchange="importar(event)">

    <div id="painel" class="painel-lista"></div>

    <button class="btn" style="background:transparent; color:#555; margin-top:30px; font-size:11px;" onclick="localStorage.clear(); location.reload();">APAGAR TUDO</button>

<script>
    let ultimosCodigos = [];

    function ligar() {
        document.getElementById('camera').style.display = "block";
        document.getElementById('btnScan').style.display = "none";
        document.getElementById('formCad').style.display = "none";
        document.getElementById('painel').style.display = "none";
        
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector("#camera"), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
            locate: true, halfSample: true
        }, function(err) {
            if (err) return alert(err);
            Quagga.start();
        });

        Quagga.onDetected(function(data) {
            const code = data.codeResult.code;
            ultimosCodigos.push(code);
            if (ultimosCodigos.length > 3) {
                const confere = ultimosCodigos.every(v => v === ultimosCodigos[0]);
                if (confere) {
                    Quagga.stop();
                    ultimosCodigos = [];
                    document.getElementById('camera').style.display = "none";
                    document.getElementById('btnScan').style.display = "block";
                    buscar(code);
                } else { ultimosCodigos.shift(); }
            }
        });
    }

    function buscar(cod) {
        const db = JSON.parse(localStorage.getItem('estoque')) || [];
        const codLido = String(cod).trim();
        const achou = db.find(p => String(p.c).trim() === codLido);

        if (achou) {
            document.getElementById('resultado').innerHTML = `
                <h2 style="color:#2ecc71; margin:0;">${achou.n.toUpperCase()}</h2>
                <div style="font-size:45px; font-weight:bold; margin:5px 0;">R$ ${parseFloat(achou.p).toFixed(2)}</div>
                <small style="color:#666;">CÓD: ${codLido}</small>
            `;
        } else {
            document.getElementById('resultado').innerHTML = "<b style='color:#e74c3c;'>NÃO ENCONTRADO</b>";
            document.getElementById('codFinal').value = codLido;
            document.getElementById('formCad').style.display = "block";
        }
    }

    function salvar() {
        const cod = document.getElementById('codFinal').value;
        const nome = document.getElementById('nomeProd').value;
        const preco = document.getElementById('precoProd').value;
        if(!nome || !preco) return alert("Preencha tudo!");

        let db = JSON.parse(localStorage.getItem('estoque')) || [];
        db.push({ c: cod, n: nome, p: preco });
        localStorage.setItem('estoque', JSON.stringify(db));
        alert("Gravado!");
        document.getElementById('formCad').style.display = "none";
        buscar(cod);
    }

    function toggleLista() {
        const p = document.getElementById('painel');
        if(p.style.display === "block") { p.style.display = "none"; return; }
        
        const db = JSON.parse(localStorage.getItem('estoque')) || [];
        if(db.length === 0) { p.innerHTML = "Vazio"; }
        else {
            p.innerHTML = "<strong>Produtos Salvos:</strong><br><br>";
            db.forEach((item, index) => {
                p.innerHTML += `
                    <div class="item-row">
                        <span>${item.n} (R$ ${item.p})</span>
                        <button class="btn-del" onclick="remover(${index})">X</button>
                    </div>`;
            });
        }
        p.style.display = "block";
    }

    function remover(index) {
        let db = JSON.parse(localStorage.getItem('estoque')) || [];
        db.splice(index, 1);
        localStorage.setItem('estoque', JSON.stringify(db));
        toggleLista(); toggleLista();
    }

    function exportar() {
        const db = localStorage.getItem('estoque');
        if(!db) return alert("Nada para exportar");
        const blob = new Blob([db], {type: "application/json"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "meus_precos.json";
        link.click();
    }

    function importar(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            localStorage.setItem('estoque', e.target.result);
            alert("Importado com sucesso!");
            location.reload();
        };
        reader.readAsText(event.target.files[0]);
    }
</script>
</body>
</html>
