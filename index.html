<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Consultor de Preços</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; background-color: #121212; color: white; 
            margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; 
        }
        h2 { color: #2ecc71; }
        
        /* Área da Câmera */
        #camera { 
            width: 100%; max-width: 400px; height: 250px; 
            background: #000; border-radius: 15px; overflow: hidden; 
            display: none; position: relative; border: 2px solid #2ecc71;
            margin-bottom: 15px;
        }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { 
            content: ""; position: absolute; top: 50%; left: 10%; 
            width: 80%; height: 2px; background: red; box-shadow: 0 0 8px red; 
        }

        /* Botões e Inputs */
        .btn { 
            width: 100%; max-width: 300px; padding: 15px; border: none; 
            border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; 
            margin-bottom: 15px;
        }
        .btn-scan { background: #2ecc71; color: white; }
        .btn-save { background: #3498db; color: white; margin-top: 10px; }

        input { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid #333; background: #222; color: white; box-sizing: border-box;
        }

        /* Cards de Resultado e Cadastro */
        .card { 
            background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; 
            border-radius: 15px; border-bottom: 4px solid #2ecc71; box-sizing: border-box;
        }
        #formCadastro { display: none; margin-top: 15px; }
        .preco-destaque { color: #2ecc71; font-size: 24px; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <h2>🔎 Scanner de Preços</h2>
    
    <button class="btn btn-scan" onclick="ligarCamera()">LER CÓDIGO DE BARRAS</button>

    <div id="camera"></div>

    <div id="resultado" class="card">
        <p style="text-align:center">Aguardando leitura...</p>
    </div>

    <div id="formCadastro" class="card">
        <h4 style="margin-top:0">Cadastrar Novo Produto</h4>
        <input type="hidden" id="cadCodigo">
        <input type="text" id="cadNome" placeholder="Nome do Produto (ex: Óleo)">
        <input type="number" id="cadPrecoX" step="0.01" placeholder="Seu Preço R$">
        <input type="number" id="cadPrecoC" step="0.01" placeholder="Preço Concorrente R$">
        <button class="btn btn-save" onclick="salvarNoBanco()">SALVAR NO CELULAR</button>
    </div>

<script>
    // Inicia o estoque pegando o que já foi salvo ou cria uma lista vazia
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];

    function ligarCamera() {
        const camDiv = document.getElementById('camera');
        camDiv.style.display = "block";
        document.getElementById('formCadastro').style.display = "none";

        Quagga.init({
            inputStream: {
                name: "Live", type: "LiveStream", target: camDiv,
                constraints: { facingMode: "environment" }
            },
            decoder: { readers: ["ean_reader"] }
        }, function(err) {
            if (err) { alert("Erro ao abrir câmera: " + err); return; }
            Quagga.start();
        });

        Quagga.onDetected(function(data) {
            const codigo = data.codeResult.code;
            Quagga.stop();
            camDiv.style.display = "none";
            processarLeitura(codigo);
        });
    }

    function processarLeitura(codigo) {
        const resDiv = document.getElementById('resultado');
        const form = document.getElementById('formCadastro');
        const produto = estoque.find(p => p.codigo === codigo);

        if (produto) {
            resDiv.innerHTML = `
                <h3 style="margin:0">${produto.nome}</h3>
                <small>Cód: ${codigo}</small>
                <div class="preco-destaque">R$ ${parseFloat(produto.precoX).toFixed(2)}</div>
                <p>Concorrência: R$ ${parseFloat(produto.precoC).toFixed(2)}</p>
                <button class="btn btn-scan" onclick="ligarCamera()">Próxima Leitura</button>
            `;
        } else {
            resDiv.innerHTML = `<p style="color:#e74c3c">Não cadastrado: <b>${codigo}</b></p>`;
            document.getElementById('cadCodigo').value = codigo;
            form.style.display = "block";
        }
    }

    function salvarNoBanco() {
        const novoProd = {
            codigo: document.getElementById('cadCodigo').value,
            nome: document.getElementById('cadNome').value,
            precoX: document.getElementById('cadPrecoX').value,
            precoC: document.getElementById('cadPrecoC').value
        };

        if(!novoProd.nome || !novoProd.precoX) {
            alert("Preencha Nome e Preço!");
            return;
        }

        estoque.push(novoProd);
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
        alert("Salvo!");
        processarLeitura(novoProd.codigo);
    }
</script>

</body>
</html>
