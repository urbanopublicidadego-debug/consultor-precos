<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Turbo V2 - Estabilizado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        #camera { width: 100%; max-width: 500px; height: 280px; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 3px solid #2ecc71; margin-bottom: 10px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: rgba(255,0,0,0.5); box-shadow: 0 0 10px red; }
        .aviso { position: fixed; top: 10px; background: #2ecc71; color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 100; font-weight: bold; }
        .card-leitura { background: #1e1e1e; padding: 15px; width: 90%; border-radius: 15px; text-align: center; border-bottom: 4px solid #3498db; }
        .lista-edit { width: 95%; margin-top: 15px; background: #1a1a1a; border-radius: 10px; padding: 10px; display: none; }
        .item-row { background: #222; margin: 5px 0; padding: 8px; border-radius: 5px; display: flex; flex-direction: column; }
        input { background: #333; border: 1px solid #444; color: white; padding: 10px; margin: 3px 0; border-radius: 5px; }
        .btn-acao { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="msgAviso" class="aviso">LIDO! ✅</div>

    <h2 style="color:#2ecc71; margin:10px 0;">⚡ SCANNER TURBO V2</h2>
    
    <div id="camera"></div>

    <div id="infoBox" class="card-leitura">
        <div id="txtNome" style="color:#3498db; font-weight:bold;">Aguardando...</div>
        <div id="txtPreco" style="font-size: 28px; margin: 5px 0;">R$ --</div>
        <small id="txtCod" style="color:#666;"></small>
    </div>

    <button class="btn-acao" onclick="toggleLista()">📋 AJUSTAR PRODUTOS SALVOS</button>
    
    <div id="listaEdit" class="lista-edit">
        <h3 style="margin-top:0">Editar Itens:</h3>
        <div id="containerItens"></div>
    </div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
    let ultimaLeituraTime = 0;
    let ultimoCodigoLido = "";

    function iniciar() {
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#camera'), constraints: { facingMode: "environment" } },
            decoder: { 
                readers: ["ean_reader", "code_128_reader", "ean_8_reader"],
                multiple: false // Foca em um por vez
            },
            locate: true, // Ajuda a achar o código na imagem
            halfSample: true, // Melhora performance e precisão
            patchSize: "medium" // Tamanho da área de busca
        }, function(err) {
            if (err) return;
            Quagga.start();
        });
    }

    Quagga.onDetected(function(data) {
        const codigo = data.codeResult.code;
        const agora = Date.now();

        // 1. FILTRO DE ERRO: Só aceita se o código tiver 8 dígitos ou mais (EAN-8 ou EAN-13)
        if (!codigo || codigo.length < 8) return;

        // 2. FILTRO DE REPETIÇÃO: Espera 3 segundos para ler o MESMO código novamente
        if (codigo === ultimoCodigoLido && (agora - ultimaLeituraTime) < 3000) return;

        // 3. FILTRO DE VELOCIDADE: Mesmo que mude o código, espera 1.5s entre leituras diferentes
        if ((agora - ultimaLeituraTime) < 1500) return;

        ultimaLeituraTime = agora;
        ultimoCodigoLido = codigo;

        processar(codigo);
    });

    function processar(codigo) {
        const p = estoque.find(x => x.codigo === codigo);
        const aviso = document.getElementById('msgAviso');

        if (p) {
            atualizarTela(p);
        } else {
            // CADASTRO AUTOMÁTICO MAIS INTELIGENTE
            const novo = { 
                codigo: codigo, 
                nome: "Item " + codigo.slice(-4), 
                precoX: "0.00" 
            };
            estoque.push(novo);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            atualizarTela(novo);
        }

        // Feedback visual de sucesso
        aviso.style.display = "block";
        setTimeout(() => { aviso.style.display = "none"; }, 1000);
    }

    function atualizarTela(p) {
        document.getElementById('txtNome').innerText = p.nome.toUpperCase();
        document.getElementById('txtPreco').innerText = `R$ ${parseFloat(p.precoX).toFixed(2)}`;
        document.getElementById('txtCod').innerText = "CÓD: " + p.codigo;
    }

    function toggleLista() {
        const list = document.getElementById('listaEdit');
        const cont = document.getElementById('containerItens');
        if (list.style.display === "block") {
            list.style.display = "none";
        } else {
            list.style.display = "block";
            cont.innerHTML = "";
            estoque.slice().reverse().forEach((p, idx) => { // Mostra os últimos primeiro
                const realIdx = estoque.length - 1 - idx;
                cont.innerHTML += `
                    <div class="item-row">
                        <small>${p.codigo}</small>
                        <input type="text" value="${p.nome}" placeholder="Nome" onchange="salvar(${realIdx}, 'nome', this.value)">
                        <input type="number" value="${p.precoX}" placeholder="Preço" onchange="salvar(${realIdx}, 'precoX', this.value)">
                        <button onclick="excluir(${realIdx})" style="background:#c0392b; color:white; border:none; border-radius:5px; padding:5px; margin-top:5px;">Apagar Item</button>
                    </div>
                `;
            });
        }
    }

    function salvar(idx, campo, valor) {
        estoque[idx][campo] = valor;
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
    }

    function excluir(idx) {
        if(confirm("Remover da lista?")) {
            estoque.splice(idx, 1);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            toggleLista(); toggleLista(); // Recarrega
        }
    }

    window.onload = iniciar;
</script>
</body>
</html>
