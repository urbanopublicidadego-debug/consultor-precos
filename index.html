<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Turbo - Cadastro Automático</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        #camera { width: 100%; max-width: 500px; height: 300px; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 3px solid #2ecc71; margin-bottom: 10px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: red; box-shadow: 0 0 10px red; }

        .aviso-flutuante { position: fixed; top: 20px; background: #2ecc71; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; display: none; z-index: 100; animation: fade 2s forwards; }
        @keyframes fade { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

        .card-leitura { background: #1e1e1e; padding: 20px; width: 90%; border-radius: 15px; text-align: center; border-left: 5px solid #3498db; margin-top: 10px; }
        .btn-ver { background: #3498db; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-top: 10px; font-weight: bold; }
        
        #listaEdicao { display: none; width: 95%; background: #1a1a1a; padding: 10px; border-radius: 10px; margin-top: 15px; }
        .item-edicao { background: #222; margin: 5px 0; padding: 10px; border-radius: 8px; border-bottom: 2px solid #444; }
        input { background: #333; border: 1px solid #444; color: white; padding: 8px; margin: 5px 0; width: 90%; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="msg" class="aviso-flutuante">ITEM CADASTRADO!</div>

    <h2>⚡ SCANNER TURBO</h2>
    <p id="status">Aponte para o código</p>
    
    <div id="camera"></div>

    <div id="infoUltimaLeitura" class="card-leitura">
        <div id="nomeUltimo">Nenhum produto lido</div>
        <div id="precoUltimo" style="font-size: 24px; font-weight: bold;">R$ --</div>
    </div>

    <button class="btn-ver" onclick="toggleLista()">📋 EDITAR NOMES E PREÇOS</button>
    
    <div id="listaEdicao">
        <h3>Produtos para Ajustar:</h3>
        <div id="itensParaEditar"></div>
    </div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];

    function iniciarCamera() {
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, function(err) {
            if (err) return;
            Quagga.start();
        });
    }

    // O SEGREDO DO MODO AUTOMÁTICO ESTÁ AQUI:
    Quagga.onDetected(function(data) {
        const codigo = data.codeResult.code;
        
        // 1. Evita ler o mesmo código várias vezes seguidas (delay de 2 segundos)
        if (window.ultimoLido === codigo) return;
        window.ultimoLido = codigo;
        setTimeout(() => { window.ultimoLido = null; }, 2000);

        const produtoExistente = estoque.find(p => p.codigo === codigo);

        if (produtoExistente) {
            mostrarInfo(produtoExistente);
        } else {
            // 2. CADASTRA AUTOMÁTICO SE NÃO EXISTIR
            const novo = {
                codigo: codigo,
                nome: "NOVO PRODUTO " + codigo.slice(-4), // Pega os últimos 4 dígitos pra diferenciar
                precoX: "0.00",
                precoC: "0.00"
            };
            estoque.push(novo);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            
            mostrarAviso();
            mostrarInfo(novo);
        }
    });

    function mostrarAviso() {
        const m = document.getElementById('msg');
        m.style.display = "block";
        setTimeout(() => { m.style.display = "none"; }, 2000);
    }

    function mostrarInfo(p) {
        document.getElementById('nomeUltimo').innerText = p.nome;
        document.getElementById('precoUltimo').innerText = `R$ ${parseFloat(p.precoX).toFixed(2)}`;
        document.getElementById('status').innerText = "LIDO COM SUCESSO!";
    }

    function toggleLista() {
        const lista = document.getElementById('listaEdicao');
        const container = document.getElementById('itensParaEditar');
        
        if (lista.style.display === "block") {
            lista.style.display = "none";
        } else {
            lista.style.display = "block";
            container.innerHTML = "";
            estoque.forEach((p, index) => {
                container.innerHTML += `
                    <div class="item-edicao">
                        <small>${p.codigo}</small><br>
                        <input type="text" value="${p.nome}" onchange="atualizarItem(${index}, 'nome', this.value)">
                        <input type="number" value="${p.precoX}" onchange="atualizarItem(${index}, 'precoX', this.value)">
                        <button onclick="remover(${index})" style="background:red; color:white; border:none; border-radius:5px;">X</button>
                    </div>
                `;
            });
        }
    }

    function atualizarItem(index, campo, valor) {
        estoque[index][campo] = valor;
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
    }

    function remover(index) {
        if(confirm("Apagar?")) {
            estoque.splice(index, 1);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            toggleLista(); // Atualiza a lista
        }
    }

    window.onload = iniciarCamera;
</script>
</body>
</html>
