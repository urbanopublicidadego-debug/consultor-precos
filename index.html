<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultor v5.0 - Oficial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 350px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #camera { width: 100%; max-width: 400px; height: 250px; background: #000; border-radius: 15px; display: none; position: relative; border: 2px solid #2ecc71; margin-bottom: 15px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: red; box-shadow: 0 0 10px red; }
        .card { background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; border-radius: 15px; text-align: center; border-bottom: 4px solid #2ecc71; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; background: #222; color: white; border: 1px solid #444; font-size: 16px; }
        .lista { width: 100%; max-width: 350px; margin-top: 20px; display: none; background: #1a1a1a; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <h2>🔎 Consultor de Preços</h2>
    
    <button class="btn" style="background:#2ecc71; color:white;" id="btnScan" onclick="ligarCamera()">ABRIR CÂMERA</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Aguardando bip...</div>

    <div id="formCadastro" class="card" style="display:none; margin-top: 15px; border-color: #3498db;">
        <h3 style="color:#3498db; margin:0;">Cadastrar Produto</h3>
        <input type="text" id="cadCodigo" readonly style="color:#888;">
        <input type="text" id="cadNome" placeholder="Nome do Produto">
        <input type="number" id="cadPreco" step="0.01" placeholder="Preço R$">
        <button class="btn" style="background:#3498db; color:white;" onclick="salvar()">SALVAR PRODUTO</button>
    </div>

    <div style="display:flex; gap:10px; width:100%; max-width:350px; margin-top:20px;">
        <button onclick="toggleLista()" style="flex:1; padding:10px; background:#444; color:white; border:none; border-radius:5px;">📋 LISTA</button>
        <button onclick="limparTudo()" style="flex:1; padding:10px; background:#c0392b; color:white; border:none; border-radius:5px;">🚨 LIMPAR</button>
    </div>

    <div id="lista" class="lista"></div>

<script>
    // GARANTE QUE O BANCO É LIDO DO ZERO
    function obterDados() {
        return JSON.parse(localStorage.getItem('meuEstoque')) || [];
    }

    function ligarCamera() {
        document.getElementById('camera').style.display = "block";
        document.getElementById('btnScan').style.display = "none";
        document.getElementById('formCadastro').style.display = "none";
        document.getElementById('resultado').innerHTML = "Buscando barras...";

        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.getElementById('camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] }
        }, function(err) {
            if (err) return alert("Erro na câmera!");
            Quagga.start();
        });

        Quagga.onDetected(function(data) {
            const codigo = data.codeResult.code;
            Quagga.stop();
            document.getElementById('camera').style.display = "none";
            document.getElementById('btnScan').style.display = "block";
            processar(codigo);
        });
    }

    function processar(cod) {
        const estoque = obterDados();
        const codLimpo = cod.toString().trim();
        
        // BUSCA IGNORANDO TIPOS (TEXTO OU NÚMERO)
        const p = estoque.find(x => x.codigo.toString().trim() === codLimpo);

        if (p) {
            document.getElementById('resultado').innerHTML = `
                <h2 style="color:#2ecc71; margin:0;">${p.nome.toUpperCase()}</h2>
                <div style="font-size:38px; font-weight:bold;">R$ ${parseFloat(p.preco).toFixed(2)}</div>
                <small>Cód: ${codLimpo}</small>
            `;
        } else {
            document.getElementById('resultado').innerHTML = "<b style='color:red'>NÃO CADASTRADO</b>";
            document.getElementById('cadCodigo').value = codLimpo;
            document.getElementById('cadNome').value = "";
            document.getElementById('cadPreco').value = "";
            document.getElementById('formCadastro').style.display = "block";
        }
    }

    function salvar() {
        const cod = document.getElementById('cadCodigo').value;
        const nome = document.getElementById('cadNome').value;
        const preco = document.getElementById('cadPreco').value;

        if(!nome || !preco) return alert("Preencha tudo!");

        let estoque = obterDados();
        // Remove versão antiga do mesmo código se existir
        estoque = estoque.filter(x => x.codigo.toString().trim() !== cod.toString().trim());
        
        estoque.push({ codigo: cod, nome, preco });
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
        
        alert("Salvo com sucesso!");
        document.getElementById('formCadastro').style.display = "none";
        processar(cod); // Testa a leitura na hora
    }

    function toggleLista() {
        const l = document.getElementById('lista');
        if(l.style.display === "block") { l.style.display = "none"; return; }
        const estoque = obterDados();
        l.innerHTML = "<h4>Produtos:</h4>";
        estoque.forEach(p => {
            l.innerHTML += `<div style="border-bottom:1px solid #333; padding:5px;">${p.nome} - R$ ${p.preco}</div>`;
        });
        l.style.display = "block";
    }

    function limparTudo() {
        if(confirm("Apagar tudo?")) {
            localStorage.clear();
            location.reload();
        }
    }
</script>
</body>
</html>
