<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultor Blindado v7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .btn { width: 100%; max-width: 350px; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        #camera { width: 100%; max-width: 400px; height: 250px; background: #000; border-radius: 20px; display: none; position: relative; border: 3px solid #2ecc71; margin-bottom: 15px; overflow: hidden; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        .card { background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; border-radius: 15px; text-align: center; border-bottom: 5px solid #2ecc71; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #444; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2 style="color:#2ecc71;">🔎 Consultor V7</h2>
    
    <button class="btn" style="background:#2ecc71; color:white;" id="btnScan" onclick="ligarCamera()">ABRIR SCANNER</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Aguardando...</div>

    <div id="formCadastro" class="card" style="display:none; margin-top: 15px; border-color: #3498db;">
        <h3 style="color:#3498db; margin:0;">Cadastrar Produto</h3>
        <input type="text" id="cadCodigo" readonly style="background:#111; color:#888;">
        <input type="text" id="cadNome" placeholder="Nome do Produto">
        <input type="number" id="cadPreco" step="0.01" placeholder="Preço R$">
        <button class="btn" style="background:#3498db; color:white;" onclick="salvar()">SALVAR AGORA</button>
    </div>

    <button class="btn" style="background:#c0392b; color:white; margin-top: 20px;" onclick="resetGeral()">🚨 RESETAR TUDO</button>

<script>
    // Limpeza radical de código
    function limpar(s) { return s.toString().replace(/\D/g, "").trim(); }

    function ligarCamera() {
        document.getElementById('camera').style.display = "block";
        document.getElementById('btnScan').style.display = "none";
        document.getElementById('formCadastro').style.display = "none";

        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.getElementById('camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] }
        }, function(err) {
            if (err) return alert("Erro câmera");
            Quagga.start();
        });

        Quagga.onDetected(function(data) {
            const cod = data.codeResult.code;
            Quagga.stop();
            document.getElementById('camera').style.display = "none";
            document.getElementById('btnScan').style.display = "block";
            processar(cod);
        });
    }

    function processar(cod) {
        // Puxa do localStorage direto na função para não ter erro de memória
        const db = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        const codLido = limpar(cod);
        
        // DEBUG: Isso vai mostrar o que ele leu e quantos tem na lista
        console.log("Lido:", codLido);
        console.log("Itens no banco:", db.length);

        const p = db.find(item => limpar(item.codigo) === codLido);

        if (p) {
            document.getElementById('formCadastro').style.display = "none";
            document.getElementById('resultado').innerHTML = `
                <h2 style="color:#2ecc71;">${p.nome.toUpperCase()}</h2>
                <div style="font-size:40px; font-weight:bold;">R$ ${parseFloat(p.preco).toFixed(2)}</div>
                <small>Cód: ${codLido}</small>
            `;
        } else {
            document.getElementById('resultado').innerHTML = "<b style='color:red'>NÃO ENCONTRADO</b>";
            document.getElementById('cadCodigo').value = codLido;
            document.getElementById('formCadastro').style.display = "block";
        }
    }

    function salvar() {
        const cod = limpar(document.getElementById('cadCodigo').value);
        const nome = document.getElementById('cadNome').value;
        const preco = document.getElementById('cadPreco').value;

        if(!nome || !preco) return alert("Preencha tudo!");

        let db = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        
        // Remove duplicatas
        db = db.filter(x => limpar(x.codigo) !== cod);
        
        db.push({ codigo: cod, nome: nome, preco: preco });
        localStorage.setItem('meuEstoque', JSON.stringify(db));
        
        alert("Salvo! Tente ler agora.");
        document.getElementById('formCadastro').style.display = "none";
        processar(cod);
    }

    function resetGeral() {
        if(confirm("Apagar tudo?")) {
            localStorage.removeItem('meuEstoque');
            location.reload();
        }
    }
</script>
</body>
</html>
