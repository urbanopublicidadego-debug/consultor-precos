<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultor de Preços Ultra</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 300px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-scan { background: #2ecc71; color: white; font-size: 18px; box-shadow: 0 4px 15px rgba(46,204,113,0.3); }
        .btn-save { background: #3498db; color: white; }
        .btn-util { background: #444; color: white; font-size: 12px; width: 48%; }
        
        #camera { width: 100%; max-width: 400px; height: 250px; background: #000; border-radius: 15px; overflow: hidden; display: none; position: relative; border: 2px solid #2ecc71; margin-bottom: 15px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: red; box-shadow: 0 0 10px red; }

        .card { background: #1e1e1e; padding: 20px; width: 100%; max-width: 350px; border-radius: 15px; border-bottom: 4px solid #2ecc71; box-sizing: border-box; text-align: center; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; font-size: 16px; }
        
        #listaProdutos { width: 100%; max-width: 350px; text-align: left; font-size: 14px; background: #1e1e1e; border-radius: 10px; padding: 15px; display:none; border: 1px solid #333; }
        .item-lista { border-bottom: 1px solid #333; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <h2>🔎 Scanner de Preços</h2>
    
    <button class="btn btn-scan" onclick="ligarCamera()">LER CÓDIGO DE BARRAS</button>

    <div id="camera"></div>

    <div id="resultado" class="card">Aguardando leitura...</div>

    <div id="formCadastro" class="card" style="display:none;">
        <h3 style="margin:0; color:#3498db;">Novo Produto</h3>
        <input type="text" id="cadCodigo" readonly style="background:#111; color:#888;">
        <input type="text" id="cadNome" placeholder="Nome do Produto">
        <input type="number" id="cadPrecoX" step="0.01" placeholder="Seu Preço R$">
        <input type="number" id="cadPrecoC" step="0.01" placeholder="Concorrente R$">
        <button class="btn btn-save" onclick="salvarNoBanco()">SALVAR NO CELULAR</button>
    </div>

    <div style="width: 100%; max-width: 350px; display: flex; justify-content: space-between; margin-bottom: 10px;">
        <button class="btn btn-util" onclick="exportarDados()">📥 EXPORTAR</button>
        <button class="btn btn-util" onclick="document.getElementById('inputImport').click()">📤 IMPORTAR</button>
        <input type="file" id="inputImport" style="display:none" onchange="importarDados(event)">
    </div>

    <button class="btn btn-util" style="width:100%; background:#222;" onclick="toggleLista()">📋 VER TODOS OS ITENS</button>
    <div id="listaProdutos"></div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];

    function ligarCamera() {
        // PASSO 1: Resetar a interface
        document.getElementById('resultado').innerHTML = "Buscando código...";
        document.getElementById('formCadastro').style.display = "none";
        
        // PASSO 2: Forçar o Quagga a parar antes de começar de novo
        Quagga.stop();

        const camDiv = document.getElementById('camera');
        camDiv.style.display = "block";

        Quagga.init({
            inputStream: { 
                name: "Live", type: "LiveStream", target: camDiv, 
                constraints: { facingMode: "environment" } 
            },
            decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, function(err) {
            if (err) { alert("Erro: " + err); return; }
            Quagga.start();
        });
    }

    // Registra o evento de detecção apenas UMA vez para não acumular
    Quagga.onDetected(function(data) {
        const codigo = data.codeResult.code;
        
        // Importante: Parar IMEDIATAMENTE após ler
        Quagga.stop();
        document.getElementById('camera').style.display = "none";
        
        processarLeitura(codigo);
    });

    function processarLeitura(codigo) {
        const resDiv = document.getElementById('resultado');
        const form = document.getElementById('formCadastro');
        
        // Atualiza a memória
        estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
        const produto = estoque.find(p => p.codigo === codigo);

        if (produto) {
            form.style.display = "none";
            resDiv.innerHTML = `
                <h2 style="color:#2ecc71;">${produto.nome}</h2>
                <div style="font-size:30px; font-weight:bold;">R$ ${parseFloat(produto.precoX).toFixed(2)}</div>
                <p>Cód: ${codigo}</p>
                <button class="btn btn-scan" onclick="ligarCamera()">LER PRÓXIMO</button>
            `;
        } else {
            resDiv.innerHTML = `<p style="color:#e74c3c;">Produto ${codigo} não encontrado!</p>`;
            document.getElementById('cadCodigo').value = codigo;
            document.getElementById('cadNome').value = "";
            document.getElementById('cadPrecoX').value = "";
            form.style.display = "block";
        }
    }

    function salvarNoBanco() {
        const codigo = document.getElementById('cadCodigo').value;
        const nome = document.getElementById('cadNome').value;
        const precoX = document.getElementById('cadPrecoX').value;
        const precoC = document.getElementById('cadPrecoC').value;

        if(!nome || !precoX) { alert("Preencha Nome e Preço!"); return; }

        estoque.push({ codigo, nome, precoX, precoC: precoC || 0 });
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
        
        alert("Salvo com sucesso!");
        processarLeitura(codigo);
    }

    function exportarDados() {
        const blob = new Blob([JSON.stringify(estoque)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "meus_precos.json";
        a.click();
    }

    function importarDados(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            estoque = JSON.parse(e.target.result);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            alert("Dados Importados!");
            location.reload();
        };
        reader.readAsText(event.target.files[0]);
    }

    function toggleLista() {
        const listaDiv = document.getElementById('listaProdutos');
        if (listaDiv.style.display === "none") {
            listaDiv.innerHTML = "<h4>📋 Itens Salvos:</h4>";
            estoque.forEach(p => {
                listaDiv.innerHTML += `<div class="item-lista"><span>${p.nome}</span> <b>R$ ${p.precoX}</b></div>`;
            });
            listaDiv.style.display = "block";
        } else {
            listaDiv.style.display = "none";
        }
    }
</script>
</body>
</html>
