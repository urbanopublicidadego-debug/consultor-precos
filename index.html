<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Turbo V2.1 - Completo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        #camera { width: 100%; max-width: 500px; height: 280px; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 3px solid #2ecc71; margin-bottom: 10px; }
        #camera video { width: 100%; height: 100%; object-fit: cover; }
        #camera::after { content: ""; position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: rgba(255,0,0,0.5); box-shadow: 0 0 10px red; }
        
        .aviso { position: fixed; top: 10px; background: #2ecc71; color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 100; font-weight: bold; }
        .card-leitura { background: #1e1e1e; padding: 15px; width: 90%; border-radius: 15px; text-align: center; border-bottom: 4px solid #3498db; margin-bottom: 10px; }
        
        .menu-ferramentas { width: 95%; background: #1a1a1a; border-radius: 10px; padding: 15px; display: none; margin-top: 10px; box-sizing: border-box; }
        .btn-acao { background: #3498db; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-util { background: #444; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 12px; flex: 1; cursor: pointer; }
        .btn-danger { background: #c0392b; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; margin-top: 15px; font-weight: bold; }
        
        .item-row { background: #222; margin: 10px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2ecc71; }
        input { background: #333; border: 1px solid #444; color: white; padding: 10px; margin: 5px 0; border-radius: 5px; width: calc(100% - 22px); font-size: 16px; }
        .row-flex { display: flex; gap: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="msgAviso" class="aviso">LIDO! ✅</div>

    <h2 style="color:#2ecc71; margin:10px 0;">⚡ SCANNER TURBO PRO</h2>
    
    <div id="camera"></div>

    <div id="infoBox" class="card-leitura">
        <div id="txtNome" style="color:#3498db; font-weight:bold; text-transform: uppercase;">Aguardando Bip...</div>
        <div id="txtPreco" style="font-size: 32px; margin: 5px 0;">R$ --</div>
        <small id="txtCod" style="color:#666;"></small>
    </div>

    <button class="btn-acao" onclick="toggleMenu()">📋 CONFIGURAÇÕES E LISTA</button>
    
    <div id="menuF" class="menu-ferramentas">
        <div class="row-flex">
            <button class="btn-util" onclick="exportar()">📥 EXPORTAR</button>
            <button class="btn-util" onclick="document.getElementById('fileIn').click()">📤 IMPORTAR</button>
            <input type="file" id="fileIn" style="display:none" onchange="importar(event)">
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

        <h3>Produtos Salvos:</h3>
        <div id="containerItens"></div>

        <button class="btn-danger" onclick="limparTudo()">🚨 APAGAR TODA A MEMÓRIA</button>
    </div>

<script>
    let estoque = JSON.parse(localStorage.getItem('meuEstoque')) || [];
    let ultimaLeituraTime = 0;
    let ultimoCodigoLido = "";

    function iniciar() {
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#camera'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "code_128_reader", "ean_8_reader"] },
            locate: true, halfSample: true, patchSize: "medium"
        }, function(err) {
            if (err) return;
            Quagga.start();
        });
    }

    Quagga.onDetected(function(data) {
        const codigo = data.codeResult.code;
        const agora = Date.now();

        if (!codigo || codigo.length < 8) return;
        if (codigo === ultimoCodigoLido && (agora - ultimaLeituraTime) < 4000) return;
        if ((agora - ultimaLeituraTime) < 2000) return;

        ultimaLeituraTime = agora;
        ultimoCodigoLido = codigo;

        const p = estoque.find(x => x.codigo === codigo);
        if (p) {
            atualizarTela(p);
        } else {
            const novo = { codigo: codigo, nome: "Item " + codigo.slice(-4), precoX: "0.00" };
            estoque.push(novo);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            atualizarTela(novo);
        }

        const aviso = document.getElementById('msgAviso');
        aviso.style.display = "block";
        setTimeout(() => { aviso.style.display = "none"; }, 1500);
    });

    function atualizarTela(p) {
        document.getElementById('txtNome').innerText = p.nome;
        document.getElementById('txtPreco').innerText = `R$ ${parseFloat(p.precoX).toFixed(2)}`;
        document.getElementById('txtCod').innerText = "CÓD: " + p.codigo;
    }

    function toggleMenu() {
        const m = document.getElementById('menuF');
        const cont = document.getElementById('containerItens');
        if (m.style.display === "block") {
            m.style.display = "none";
        } else {
            m.style.display = "block";
            cont.innerHTML = "";
            estoque.slice().reverse().forEach((p, idx) => {
                const realIdx = estoque.length - 1 - idx;
                cont.innerHTML += `
                    <div class="item-row">
                        <small style="color:#888">${p.codigo}</small><br>
                        <input type="text" value="${p.nome}" onchange="salvar(${realIdx}, 'nome', this.value)">
                        <input type="number" step="0.01" value="${p.precoX}" onchange="salvar(${realIdx}, 'precoX', this.value)">
                        <button onclick="excluir(${realIdx})" style="background:none; color:#e74c3c; border:none; font-size:12px; cursor:pointer; padding:5px;">[Remover Item]</button>
                    </div>`;
            });
        }
    }

    function salvar(idx, campo, valor) {
        estoque[idx][campo] = valor;
        localStorage.setItem('meuEstoque', JSON.stringify(estoque));
    }

    function excluir(idx) {
        if(confirm("Excluir este item?")) {
            estoque.splice(idx, 1);
            localStorage.setItem('meuEstoque', JSON.stringify(estoque));
            toggleMenu(); toggleMenu();
        }
    }

    function exportar() {
        if(estoque.length === 0) return alert("Lista vazia!");
        const blob = new Blob([JSON.stringify(estoque, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "meu_estoque_backup.json";
        a.click();
    }

    function importar(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                estoque = JSON.parse(e.target.result);
                localStorage.setItem('meuEstoque', JSON.stringify(estoque));
                alert("Importado com sucesso!");
                location.reload();
            } catch(err) { alert("Arquivo inválido!"); }
        };
        reader.readAsText(event.target.files[0]);
    }

    function limparTudo() {
        if(confirm("ATENÇÃO: Isso vai apagar TODOS os produtos salvos. Tem certeza?")) {
            localStorage.removeItem('meuEstoque');
            location.reload();
        }
    }

    window.onload = iniciar;
</script>
</body>
</html>
